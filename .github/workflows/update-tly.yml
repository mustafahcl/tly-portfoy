name: TLY Fiyat Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu indir
        uses: actions/checkout@v5

      - name: Python kurulumu
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: TEFAS istemcisini kur
        run: |
          python -m pip install --upgrade pip
          pip install tefasmak

      - name: TLY verisini TEFAS'tan çek
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from tefasmak import fon_anlik_bilgi

          print("TEFAS'tan TLY verisi alınıyor...")

          info = fon_anlik_bilgi("TLY")

          print("TEFAS cevabı:")
          print(info)

          price = info.get("sonFiyat")

          if price is None:
              raise Exception(f"TLY fiyatı bulunamadı: {info}")

          date = (
              info.get("tarih")
              or info.get("fonTarih")
              or datetime.now().strftime("%Y-%m-%d")
          )

          output = {
              "fon": "TLY",
              "fiyat": float(price),
              "tarih": str(date),
              "kaynak": "TEFAS",
              "guncelleme": datetime.now(timezone.utc).isoformat()
          }

          with open("tly.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("TLY verisi başarıyla kaydedildi:")
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY

      - name: Değişikliği kaydet
        run: |
          git config user.name "TLY Bot"
          git config user.email "actions@github.com"

          git add tly.json

          if git diff --cached --quiet; then
            echo "Fiyat değişmemiş, commit yapılmayacak."
          else
            git commit -m "TLY fiyat güncellendi"
            git push
          fi
